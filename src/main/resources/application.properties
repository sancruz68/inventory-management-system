
spring.application.name=inventory-management-system

# Use cookies for session tracking
server.servlet.session.tracking-modes=cookie

# Local H2 database
spring.datasource.url=jdbc:h2:file:./data/inventorydb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Preserve database tables between restarts
spring.jpa.hibernate.ddl-auto=update

# Disable database queries during view rendering
spring.jpa.open-in-view=false
